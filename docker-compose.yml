# Postgres de desarrollo y pruebas. Solo local; en Railway la base es un servicio gestionado.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: td
      POSTGRES_PASSWORD: td
      POSTGRES_DB: task_dashboard
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U td -d task_dashboard"]
      interval: 2s
      timeout: 2s
      retries: 15
