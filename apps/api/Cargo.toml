[package]
name = "task-dashboard-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Un solo proceso: /health, /api (JWT de syntroAuth), /mcp (PAT). Ver docs/PLAN-PASO-1.md."

[[bin]]
name = "task-dashboard-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
